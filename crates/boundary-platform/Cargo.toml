[package]
name = "boundary-platform"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
anyhow.workspace = true
boundary-session.workspace = true
image.workspace = true
fast_image_resize.workspace = true
xcap = "0.9.8"
enigo = "0.6.1"

# Per monitor DPI awareness, so a pointer position and a captured pixel are
# the same coordinate on a scaled Windows display.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_HiDpi",
    # The service and the copy it starts at the sign in screen.
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
