[package]
name = "boundary-platform"
version.workspace = true
edition = "2024"
license.workspace = true

[dependencies]
anyhow.workspace = true
boundary-session.workspace = true
image.workspace = true
fast_image_resize.workspace = true
enigo = "0.6.1"

[target.'cfg(not(target_os = "linux"))'.dependencies]
xcap = "0.9.8"

# X11: shared memory capture, damage to know what changed, RandR for where
# each monitor is. Wayland: the desktop portal for consent, a PipeWire stream
# for the pixels and the portal's remote desktop for input. x11rb and ashpd
# are all Rust; PipeWire was already linked through xcap.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "damage", "xfixes", "randr"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "remote_desktop", "screencast"] }
async-io = "2"
futures-lite = "2"
pipewire = "0.10"
libc = "0.2"
# Virtual pointer and keyboard on wlroots compositors, which have no remote
# desktop portal.
enigo = { version = "0.6.1", features = ["wayland"] }

# Per monitor DPI awareness, so a pointer position and a captured pixel are
# the same coordinate on a scaled Windows display.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_UI_HiDpi",
    # The service and the copy it starts at the sign in screen.
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2 = "0.6"
objc2-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-screen-capture-kit = "0.3.2"
dispatch2 = "0.3"
block2 = "0.6"
libc = "0.2"
