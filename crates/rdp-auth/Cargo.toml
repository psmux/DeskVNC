[package]
name = "rdp-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# CredSSP, SPNEGO, NTLMv2, and later Kerberos. Pure state machines over byte
# slices: feed them a token, get a token back.
#
# MUST NOT depend on tokio or on any I/O (D12). The session does the I/O.
# MUST NOT depend on any third party CredSSP, SPNEGO, NTLM or Kerberos
# implementation (D3).
# MUST NOT implement a cryptographic operation. Every cipher, hash, MAC, KDF
# and cipher mode in this crate is a call into a crate named below
# (PRDRDP/00 R54, PRDRDP/11 §3.1 rule 0). What this crate owns is the order
# the calls happen in, which is what MS-NLMP and MS-CSSP specify.
# The only workspace dependency is rdp-pdu, for `io` and `asn1::der` only.
# Enforced by crates/rdp-pdu/tests/workspace_rules.rs (PRDRDP/12 §2.5).

[dependencies]
rdp-pdu = { path = "../rdp-pdu" }

thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }     # CSPRNG: client challenge, clientNonce
zeroize = { workspace = true }

# Every cryptographic operation in this crate comes from one of these. None of
# them knows what NTLM is; the sequence is ours and the arithmetic is theirs
# (PRDRDP/00 R54).
md4 = { workspace = true }      # NTOWFv2 (MS-NLMP 3.3.2)
md-5 = { workspace = true }     # NTLM session security (MS-NLMP 3.4.5.2)
sha1 = { workspace = true }     # Kerberos AES checksums (RFC 3962)
sha2 = { workspace = true }     # CredSSP hashes (MS-CSSP 3.1.5)
hmac = { workspace = true }     # HMAC-MD5 for NTLMv2, HMAC-SHA1 for Kerberos
# NTLM SEAL/SIGN key streams (MS-NLMP 3.4.3).
# The `zeroize` feature is NOT on by default in rc4 0.2: it forwards to
# `cipher/zeroize`, and both the `ZeroizeOnDrop` on `Rc4` and the clearing of
# the 256 byte state array in its `Drop` are behind
# `#[cfg(feature = "zeroize")]`. PRDRDP/14 §8.2 depends on it. Drop this line
# and that paragraph becomes false silently, with no compile error and no test
# failure, because a missing zeroize is invisible to every test that can be
# written in process.
rc4 = { workspace = true, features = ["zeroize"] }
aes = { workspace = true }      # Kerberos AES128 and AES256, phase 3
cbc = { workspace = true }      # the CBC half of AES-CTS
cipher = { workspace = true }
subtle = { workspace = true }   # constant time compares (PRDRDP/12 §9.8)
# The modular exponentiation of the licensing premaster secret (MS-RDPELE
# 5.1.1.1), which is raw RSA with no padding scheme and so is not an
# operation any RSA crate exposes. Already in Cargo.lock under vnc-core.
num-bigint-dig = { workspace = true }

# Kerberos, phase 3, behind the `kerberos` feature. Both are workspace
# dependencies, so their versions live in the root manifest.
#
# cts: CBC with ciphertext stealing, RFC 3962 §5. RustCrypto, the same
# repository as `cbc`, and on the same `cipher` 0.5 generation as the `aes`
# and `cbc` in this workspace. Its single block case does not follow RFC 3962
# §5 and `kerberos/crypto.rs` routes around it; the comment there is the whole
# story and `tests/vectors_kerberos.rs` holds the branch.
cts = { workspace = true, optional = true }
# pbkdf2: RFC 3962 §4 string-to-key, on the `digest` 0.11 generation like the
# `sha1` and `hmac` above. `default-features = false` with `hmac` back on is
# exactly `pbkdf2_hmac` and none of the `password-hash` surface.
pbkdf2 = { workspace = true, optional = true }

[features]
default = []
# Kerberos: phase 3 (D10). PRDRDP/11 §3.9.2's ciphertext stealing escalation is
# answered in `kerberos/crypto.rs`: option 1, take `cts` and dispatch the
# single block case to `cbc`, with both arms library calls and no cipher mode
# written here.
kerberos = ["dep:cts", "dep:pbkdf2"]

[dev-dependencies]
hex = { workspace = true }
