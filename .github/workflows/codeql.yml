name: CodeQL

# Advanced setup, so the scan can skip vendored crates, tests and examples
# (.github/codeql/codeql-config.yml). It replaces code scanning's default
# setup, which is turned off in the repository settings: while it is on,
# GitHub refuses uploads from this workflow.
#
# Every language here is scanned without a build (build-mode none), the same
# as default setup, so the scan needs no toolchains and paths-ignore applies.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      # Lets the action read workflow run details on a private fork.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
