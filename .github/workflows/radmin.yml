name: Radmin installer smoke builds
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/radmin-core/**'
      - 'crates/remote-core/**'
      - 'crates/vnc-discovery/**'
      - 'crates/vnc-store/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/radmin.yml'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev
      - run: cargo test --locked -p radmin-core -p remote-core -p vnc-store
      - run: cargo test --locked -p vnc-discovery --lib --test radmin_probe --test rdp_probe
      - run: npm ci --prefix ui
      - run: npm run typecheck --prefix ui
      - run: npm test --prefix ui
      - name: Build native Rust installer
        run: npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v4
        with:
          name: DeskVNC-Radmin-${{ matrix.target }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
