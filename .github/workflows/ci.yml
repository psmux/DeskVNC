name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libssl-dev libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (library crates)
        run: cargo clippy -p vnc-core -p vnc-transport -p vnc-discovery -p vnc-store -- -D warnings

      - name: Test
        run: cargo test -p vnc-core -p vnc-transport -p vnc-discovery -p vnc-store

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # Every step runs inside ui/. Running `npx tsc` from the repo root finds
      # no local node_modules (deps live in ui/), so npx silently downloads the
      # unrelated `tsc` package from the registry, which is not the TypeScript
      # compiler and always exits 1.
      - run: npm ci
        working-directory: ui
      - run: npx tsc --noEmit
        working-directory: ui
      - run: npm run build
        working-directory: ui

  audit:
    name: Security audit
    runs-on: ubuntu-22.04
    # The action publishes results as a check run, which the default read-only
    # GITHUB_TOKEN cannot create ("Resource not accessible by integration").
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Accepted advisories, each with a written justification, live in
      # .cargo/audit.toml. Anything new fails the job.
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
