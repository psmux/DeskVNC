[package]
name = "deskvncviewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DeskVNCViewer, a premium cross-platform VNC client"
default-run = "deskvncviewer"

[lib]
name = "deskvncviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
os_info = { version = "3", default-features = false }

remote-core = { path = "../crates/remote-core" }
# The framebuffer mirrors the agent plane keeps, one per session that asked for
# one: `MirrorSlot`, `DamageLog`, the perception ladder and the encode path
# (PRDAgentPlug/00 R5, 00 R6). The shell is the second consumer of the
# `SessionEvent` stream and this is what it feeds; see
# `src-tauri/src/agent/mirror.rs`.
agent-perception = { path = "../crates/agent-perception" }
# `Timestamp`, and nothing else. `agent-perception` takes the time as an
# argument rather than reading a clock, which is what makes an idle timeout
# testable without a runtime, and the type that time is spelled in lives here.
limb-core = { path = "../crates/limb-core" }
# `ClientCommand::TerminalInput` carries a `bytes::Bytes`; framing.rs builds
# one straight from the decoded PTY-input payload, no intermediate Vec copy.
bytes = { workspace = true }
rdp-core = { path = "../crates/rdp-core" }
vnc-core = { path = "../crates/vnc-core" }
vnc-discovery = { path = "../crates/vnc-discovery" }
vnc-files = { path = "../crates/vnc-files" }
ssh-transport = { path = "../crates/ssh-transport" }
ssh-core = { path = "../crates/ssh-core" }
vnc-input-capture = { path = "../crates/vnc-input-capture" }
vnc-store = { path = "../crates/vnc-store" }
vnc-transport = { path = "../crates/vnc-transport" }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
