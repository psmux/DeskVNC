[package]
name = "deskvncviewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "DeskVNCViewer, a premium cross-platform VNC client"
default-run = "deskvncviewer"

[lib]
name = "deskvncviewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"

vnc-core = { path = "../crates/vnc-core" }
vnc-discovery = { path = "../crates/vnc-discovery" }
vnc-files = { path = "../crates/vnc-files" }
vnc-input-capture = { path = "../crates/vnc-input-capture" }
vnc-store = { path = "../crates/vnc-store" }
vnc-transport = { path = "../crates/vnc-transport" }

tokio = { workspace = true }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
crossbeam-channel = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
tempfile = "3"
