[workspace]
resolver = "2"
members = [
    "crates/boundary-driver",
    "crates/boundary-session",
    "crates/boundary-codes",
    "crates/boundary-platform",
    "crates/boundary-provision",
    "crates/boundary-app",
    # Protocol-neutral layers. Every protocol crate depends on these; these
    # depend on no protocol crate (PRDRDP/01 §2.2, PRDRDP/02 §3).
    "crates/remote-core",
    "crates/remote-pixel",
    # The SSH carrier and everything that rides it. `ssh-transport` depends on
    # no feature crate; `vnc-files` and `ssh-core` both sit on top of it.
    "crates/ssh-transport",
    "crates/ssh-core",
    # The RDP set (AGENT_BRIEF D12, PRDRDP/12 §2).
    "crates/rdp-pdu",
    "crates/rdp-codecs",
    "crates/rdp-auth",
    "crates/rdp-core",
    "crates/vnc-core",
    "crates/vnc-transport",
    "crates/vnc-discovery",
    "crates/vnc-store",
    "crates/vnc-files",
    "crates/vnc-input-capture",
    # The agent plane (PRDAgentPlug/01 §3, /02, /08 §5). Deliberately two
    # crates rather than one: `agent-lease` is arbitration and knows nothing
    # about limbs, protocols or tokio channels, so it can be reasoned about and
    # tested on its own, and `limb-core` is the contract a limb implements and
    # depends only on `remote-core`. Neither depends on tauri, so the plane is
    # reachable from a headless binary (PRDAgentPlug/03 §1).
    "crates/agent-lease",
    "crates/limb-core",
    "crates/agent-perception",
    "crates/agent-plane",
    # The named pipe both listeners use on Windows, with its owner only ACL.
    "crates/local-pipe",
    "crates/dvv",
    # The fast lane's eyes: a desktop's controls as a table, served on the LAN.
    "crates/fastlane-sense",
    "crates/fastlane-plan",
    # Remote desktop benchmark: the stage window and the measuring client.
    "crates/bench-stage",
    "crates/remote-bench",
    "src-tauri",
    # The phone app, its own Tauri crate over the same protocol crates
    # (mobile/README.md).
    "mobile/src-tauri",
]

# Fuzz targets live in their own workspaces so `libfuzzer-sys` and `arbitrary`
# stay out of the main dependency tree (AGENT_BRIEF D11, PRDRDP/11 §3.3).
exclude = [
    "crates/rdp-pdu/fuzz",
    "crates/rdp-codecs/fuzz",
    "crates/rdp-auth/fuzz",
    # Patched copies of crates.io crates, see [patch.crates-io] below.
    "patches",
]

[workspace.package]
version = "0.36.1"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Godwin Sam Josh"]
repository = "https://github.com/psmux/DeskVNC"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# codecs
# zlib-rs backend (PRD/01 §4): ~90% of the zlib/Tight/ZRLE decode path is
# inflate, and zlib-rs is materially faster than the default miniz_oxide while
# staying pure Rust (no C toolchain on any of the three platforms).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zune-jpeg = "0.5"

# crypto
des = "0.9"
cbc = "0.2"
ecb = "0.2"
cipher = "0.5"
aes = "0.9"
eax = "0.6"
sha1 = "0.11"
md4 = "0.11"
hmac = "0.13"
rc4 = "0.2"
subtle = "2"
# Kerberos only, behind rdp-auth's `kerberos` feature and nothing else.
# `cts` is CBC with ciphertext stealing (RFC 3962 §5). Read the module comment
# on crates/rdp-auth/src/kerberos/crypto.rs before touching how it is called:
# its single block case is wrong, and wrong in a way that round trips against
# itself, so the length dispatch around it is load bearing.
cts = "0.7"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
sha2 = "0.11"
md-5 = "0.11"
rsa = { version = "0.10", features = ["pkcs1v15"] }
num-bigint-dig = "0.9"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.6"
chacha20poly1305 = "0.11"

# tls / ssh
russh = "0.65"
russh-sftp = "3"
rustls = "0.23"
# Legacy TLS backend, optional and off by default (AGENT_BRIEF V3-B, PRDRDP/10
# P0.6). Only vnc-transport may name these, which crates/rdp-pdu/tests/
# workspace_rules.rs enforces. `=300.5.5` builds OpenSSL 3.5.5 from the 3.5 LTS
# branch, supported to 2030-04-08. As of 2026-11-10 it is still the newest
# build openssl-sys can use: openssl-sys 0.9.118 accepts openssl-src ^300 only,
# the 300.x line ends at 300.6.1 (OpenSSL 3.6, end of life 2026-11-01), and
# openssl-src moved on to 400.x (OpenSSL 4.0) without publishing the later 3.5
# patch releases. Move this to the next 300.5.x build the day one is published,
# or to 400.x once openssl-sys accepts it. Moving this pin is an advisory
# policy decision, never a `cargo update`.
openssl = { version = "0.10.81", features = ["vendored"] }
openssl-src = "=300.5.5"
tokio-openssl = "0.6"
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "1"

# discovery
mdns-sd = "0.21"
netdev = "0.47"
mac_address = "1"

# storage
rusqlite = { version = "0.41", features = ["bundled"] }
keyring = "4"
directories = "6"

# images
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
xcap = "0.9.8"
enigo = "0.6.1"
eframe = { version = "0.37", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
async-trait = "0.1"
tempfile = "3"
if-addrs = "0.15"
open = "5"

boundary-session = { path = "crates/boundary-session" }
boundary-codes = { path = "crates/boundary-codes" }
boundary-platform = { path = "crates/boundary-platform" }
boundary-provision = { path = "crates/boundary-provision" }
iroh = "1.2"
getrandom = "0.4"
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
fast_image_resize = "6"

# misc
socket2 = { version = "0.6", features = ["all"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
byteorder = "1"
hex = "0.4"
base64 = "0.23"
parking_lot = "0.13"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# iOS builds with the current libc. libc 0.2.190 and later declare the
# routing socket constants and `in6_ifreq` for macOS only, although iOS has
# the same kernel definitions. netdev and netwatch still expect them on iOS,
# so these copies carry a small fix each (search for "DeskVNC patch").
# netwatch 0.19.3 is the newest release iroh 1.4.1 accepts, and it pulls
# netdev 0.46; our own crates use netdev 0.47. Drop an entry once its crate
# ships a release that builds for iOS against the current libc.
# patches/README.md has the details.
[patch.crates-io]
netdev = { path = "patches/netdev-0.47.0" }
netdev-046 = { path = "patches/netdev-0.46.3", package = "netdev" }
netwatch = { path = "patches/netwatch-0.19.3" }
# russh 0.65.1 pins rsa =0.10.0-rc.18 and ssh-key =0.7.0-rc.11, which Cargo
# cannot hold next to the rsa 0.10.0 vnc-core uses. The copy carries upstream
# russh PR 821; see patches/README.md.
russh = { path = "patches/russh-0.65.1" }
