[workspace]
resolver = "2"
members = [
    "crates/vnc-core",
    "crates/vnc-transport",
    "crates/vnc-discovery",
    "crates/vnc-store",
    "crates/vnc-files",
    "crates/vnc-input-capture",
    "src-tauri",
]

[workspace.package]
version = "0.11.0"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
authors = ["DeskVNCViewer contributors"]
repository = "https://github.com/psmux/DeskVNC"

[workspace.dependencies]
# async runtime
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"

# errors / logging
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# codecs
# zlib-rs backend (PRD/01 §4): ~90% of the zlib/Tight/ZRLE decode path is
# inflate, and zlib-rs is materially faster than the default miniz_oxide while
# staying pure Rust (no C toolchain on any of the three platforms).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
zune-jpeg = "0.5"

# crypto
des = "0.8"
cbc = "0.1"
ecb = "0.1"
cipher = "0.4"
aes = "0.8"
eax = "0.5"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
rsa = "0.10.0-rc.18"
num-bigint-dig = "0.8"
rand = "0.10"
zeroize = { version = "1", features = ["derive"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"

# tls / ssh
russh = "0.62"
russh-sftp = "2.3"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pki-types = "1"
webpki-roots = "1"

# discovery
mdns-sd = "0.20"
netdev = "0.45"
mac_address = "1"

# storage
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
directories = "6"

# images
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
fast_image_resize = "6"

# misc
socket2 = { version = "0.5", features = ["all"] }
uuid = { version = "1", features = ["v4", "serde"] }
bytes = "1"
byteorder = "1"
hex = "0.4"
base64 = "0.22"
parking_lot = "0.12"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
